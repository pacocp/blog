{{- /* Row of links to every category. Context: current page. */ -}}
{{- with site.Taxonomies.categories -}}
<nav class="chips" aria-label="Categories">
  {{ with site.GetPage "/blog" }}<a href="{{ .RelPermalink }}"{{ if eq $.Kind "section" }} aria-current="page"{{ end }}>All</a>{{ end }}
  {{ range .ByCount }}
  <a href="{{ .Page.RelPermalink }}"{{ if eq .Page.RelPermalink $.RelPermalink }} aria-current="page"{{ end }}>{{ .Page.Title }} <span class="count">{{ .Count }}</span></a>
  {{ end }}
</nav>
{{- end -}}
